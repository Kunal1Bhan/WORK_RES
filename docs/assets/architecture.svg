  <text x="900" y="467" class="xs">pip-audit → docker build</text>
  <text x="900" y="481" class="xs">browser E2E (Cr + Fx)</text>
  <text x="900" y="495" class="xs">dependabot weekly</text>

  <!-- ============ FLOWS (ordered fan-in: no two lines cross on the left edge) ============ -->
