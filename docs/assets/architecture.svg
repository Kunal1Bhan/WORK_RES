  <text x="95" y="483" class="xs">SLO verdict + policy fix</text>
  <text x="95" y="496" class="xs">cooldown + audit.log</text>

  <!-- ============ SERVICES (col B) ============ -->
  <rect x="195" y="48" width="200" height="280" class="grp"/>
  <text x="295" y="62" class="gt" text-anchor="middle">SERVICES (:8000)</text>
  <rect x="205" y="72" width="180" height="150" class="box"/>
  <text x="295" y="92" class="t">FastAPI api</text>
  <text x="295" y="108" class="s">POST /api/orders → 201</text>
  <text x="295" y="123" class="s">GET /api/orders?limit&amp;offset</text>
  <text x="295" y="138" class="s">GET /api/orders/{id} (cached)</text>
