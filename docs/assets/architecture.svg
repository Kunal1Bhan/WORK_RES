  <text x="707" y="121" class="xs">rules: 5xx&gt;5% (page)</text>
  <text x="707" y="135" class="xs">p95&gt;500ms · queue&gt;50</text>
  <text x="707" y="149" class="xs">db==0 (page)</text>
  <text x="707" y="163" class="xs">JSON logs → stdout</text>
  <text x="707" y="177" class="xs">OTEL opt-in (OTLP/console)</text>
  <text x="707" y="191" class="xs">X-Request-ID tracing</text>
  <rect x="630" y="214" width="155" height="102" class="box"/>
  <text x="707" y="234" class="t">Grafana :3000</text>
  <text x="707" y="249" class="s">provisioned datasource</text>
  <text x="707" y="263" class="xs">RPS · err% · p50/p95/p99</text>
  <text x="707" y="277" class="xs">queue · db · orders</text>
  <text x="707" y="291" class="xs">home dashboard JSON</text>
  <text x="707" y="305" class="xs">admin via env secret</text>

  <!-- ============ PLATFORM (col E) ============ -->
