  <text x="295" y="252" class="t">worker ×N</text>
  <text x="295" y="267" class="s">drains queue → status=done</text>
  <text x="295" y="282" class="s">SIGTERM-safe · rollback on err</text>
  <text x="295" y="297" class="xs">competing consumers scale out</text>

