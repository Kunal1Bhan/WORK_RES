  <rect x="825" y="200" width="150" height="118" class="box"/>
  <text x="900" y="220" class="t">Go operator</text>
  <text x="900" y="235" class="s">ProductionService CRD</text>
  <text x="900" y="249" class="xs">image · replicas · rollback</text>
  <text x="900" y="263" class="xs">reconcile: drift / scale /</text>
  <text x="900" y="277" class="xs">rollback / no-flap hold</text>
  <text x="900" y="291" class="xs">go test 5/5 · CRD on kind</text>
  <text x="900" y="305" class="xs">manager wiring pending</text>
  <rect x="825" y="328" width="150" height="80" class="shade"/>
