  <rect x="415" y="48" width="185" height="280" class="grp"/>
  <text x="507" y="62" class="gt" text-anchor="middle">DATA</text>
  <rect x="425" y="72" width="165" height="118" class="box"/>
  <text x="507" y="92" class="t">Postgres 16</text>
  <text x="507" y="107" class="s">orders(id, item≤200,</text>
  <text x="507" y="121" class="s">status, created_at)</text>
  <text x="507" y="135" class="xs">idx(status) · idx(created_at)</text>
  <text x="507" y="149" class="xs">pool 5+10 · pre-ping</text>
  <text x="507" y="163" class="xs">seed.py · dumps for backup</text>
  <text x="507" y="177" class="xs">fallback: SQLite file</text>
  <rect x="425" y="200" width="165" height="116" class="box"/>
  <text x="507" y="220" class="t">Redis 7</text>
  <text x="507" y="235" class="s">cache (TTL 30s) + queue</text>
  <text x="507" y="249" class="xs">AOF persist · PING health</text>
  <text x="507" y="263" class="xs">fallback: in-memory</text>
  <text x="507" y="277" class="xs">(per-process — needs</text>
  <text x="507" y="291" class="xs">Redis across processes)</text>
  <text x="507" y="305" class="xs">queue_depth gauge</text>

