<svg xmlns="http://www.w3.org/2000/svg" width="860" height="380" font-family="Segoe UI, sans-serif">
  <defs>
    <style>
      .box { fill: #0d1117; stroke: #58a6ff; stroke-width: 1.5; rx: 8; }
      .box2 { fill: #0d1117; stroke: #3fb950; stroke-width: 1.5; rx: 8; }
      .box3 { fill: #0d1117; stroke: #d29922; stroke-width: 1.5; rx: 8; }
      .t { fill: #e6edf3; font-size: 13px; text-anchor: middle; }
      .s { fill: #8b949e; font-size: 11px; text-anchor: middle; }
      .ln { stroke: #8b949e; stroke-width: 1.5; }
      .hd { fill: #f0f6fc; font-size: 15px; font-weight: bold; }
    </style>
  </defs>
  <rect width="860" height="380" fill="#ffffff"/>
  <text x="430" y="28" class="hd" fill="#111" text-anchor="middle">Infrastructure Reliability Lab</text>

  <!-- client -->
  <rect x="20" y="60" width="130" height="60" class="box3" style="fill:#fff8e6"/>
  <text x="85" y="85" class="t" fill="#111">lab_gui.py</text>
  <text x="85" y="102" class="s" fill="#555">one-click console</text>

  <!-- api -->
  <rect x="200" y="60" width="150" height="60" class="box" style="fill:#eef4ff"/>
  <text x="275" y="85" class="t" fill="#111">FastAPI api</text>
  <text x="275" y="102" class="s" fill="#555">:8000 + /metrics</text>

  <!-- db/cache/queue -->
  <rect x="400" y="45" width="150" height="50" class="box2" style="fill:#eefbf0"/>
  <text x="475" y="65" class="t" fill="#111">Postgres / SQLite</text>
  <text x="475" y="82" class="s" fill="#555">orders</text>
  <rect x="400" y="105" width="150" height="50" class="box2" style="fill:#eefbf0"/>
  <text x="475" y="125" class="t" fill="#111">Redis / memory</text>
  <text x="475" y="142" class="s" fill="#555">cache + queue</text>

  <!-- worker -->
  <rect x="600" y="60" width="130" height="60" class="box" style="fill:#eef4ff"/>
  <text x="665" y="85" class="t" fill="#111">worker</text>
  <text x="665" y="102" class="s" fill="#555">drains queue</text>

  <!-- observability -->
  <rect x="200" y="180" width="150" height="60" class="box3" style="fill:#fff8e6"/>
  <text x="275" y="205" class="t" fill="#111">Prometheus</text>
  <text x="275" y="222" class="s" fill="#555">alerts + Grafana</text>

  <!-- engines -->
  <rect x="20" y="180" width="130" height="60" class="box" style="fill:#eef4ff"/>
  <text x="85" y="205" class="t" fill="#111">failurectl</text>
  <text x="85" y="222" class="s" fill="#555">chaos CLI</text>
  <rect x="20" y="260" width="130" height="60" class="box" style="fill:#eef4ff"/>
  <text x="85" y="285" class="t" fill="#111">slo.py</text>
  <text x="85" y="302" class="s" fill="#555">availability + p99</text>
  <rect x="200" y="260" width="150" height="60" class="box" style="fill:#eef4ff"/>
  <text x="275" y="285" class="t" fill="#111">policy remediate</text>
  <text x="275" y="302" class="s" fill="#555">detect → fix → audit</text>

  <!-- gpu -->
  <rect x="400" y="220" width="150" height="60" class="box2" style="fill:#eefbf0"/>
  <text x="475" y="245" class="t" fill="#111">model serving</text>
  <text x="475" y="262" class="s" fill="#555">RTX 3070 Ti · 75 rps</text>

  <!-- k8s -->
  <rect x="600" y="220" width="130" height="60" class="box3" style="fill:#fff8e6"/>
  <text x="665" y="245" class="t" fill="#111">kind / k8s</text>
  <text x="665" y="262" class="s" fill="#555">+ Go operator</text>

  <!-- arrows -->
  <line x1="150" y1="90" x2="198" y2="90" class="ln"/>
  <line x1="350" y1="80" x2="398" y2="70" class="ln"/>
  <line x1="350" y1="100" x2="398" y2="130" class="ln"/>
  <line x1="550" y1="130" x2="598" y2="100" class="ln"/>
  <line x1="275" y1="120" x2="275" y2="178" class="ln"/>
  <line x1="150" y1="210" x2="198" y2="210" class="ln"/>
  <line x1="275" y1="90" x2="120" y2="178" class="ln"/>
  <line x1="400" y1="90" x2="352" y2="200" class="ln"/>
  <line x1="475" y1="155" x2="475" y2="218" class="ln"/>
  <line x1="600" y1="90" x2="640" y2="218" class="ln"/>

  <text x="430" y="350" class="s" fill="#555">API → DB + cache + queue → worker · metrics → Prometheus/Grafana · chaos → SLO → remediation</text>
</svg>
