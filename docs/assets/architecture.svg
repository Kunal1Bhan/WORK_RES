  <text x="295" y="183" class="xs">auth · ratelimit · req-ID · OTEL</text>
  <text x="295" y="198" class="xs">uvicorn, non-root uid 10001</text>
  <text x="295" y="213" class="xs">401/403/404/422/429/500/503</text>
