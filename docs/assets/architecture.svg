    </style>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8" fill="none" stroke="#111" stroke-width="1.3"/>
    </marker>
  </defs>
  <rect width="1000" height="700" fill="#ffffff"/>
  <text x="500" y="30" class="hd">Infrastructure Reliability Lab — System Architecture</text>

  <!-- ============ CLIENTS (col A) ============ -->
