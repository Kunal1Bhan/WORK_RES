apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-worker
spec:
  replicas: 1
  selector:
    matchLabels: {app: lab-worker}
  template:
    metadata:
      labels: {app: lab-worker}
    spec:
      containers:
        - name: worker
          image: lab-api:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.worker"]
          env:
            - {name: DATABASE_URL, value: postgresql+psycopg://lab:lab@db:5432/lab}
            - {name: REDIS_URL, value: redis://cache:6379/0}
