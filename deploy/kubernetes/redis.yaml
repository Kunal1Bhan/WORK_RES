apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-cache
  labels: {app: lab-cache}
spec:
  replicas: 1
  selector:
    matchLabels: {app: lab-cache}
  template:
    metadata:
      labels: {app: lab-cache}
    spec:
      containers:
        - name: cache
          image: redis:7
          ports: [{containerPort: 6379}]
---
apiVersion: v1
kind: Service
metadata:
  name: cache
spec:
  selector: {app: lab-cache}
  ports: [{port: 6379}]
