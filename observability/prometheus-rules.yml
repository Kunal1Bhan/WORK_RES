groups:
  - name: reliability-lab
    interval: 15s
    rules:
      - alert: LabHighErrorRate
        expr: |
          sum(rate(lab_http_requests_total{status=~"5.."}[2m]))
          / sum(rate(lab_http_requests_total[2m])) > 0.05
        for: 1m
        labels: {severity: page}
        annotations:
          summary: "5xx rate above 5% for 1m (SLO: 99.9%)"
      - alert: LabP95LatencyHigh
        expr: |
          histogram_quantile(0.95, sum(rate(lab_http_latency_seconds_bucket[5m])) by (le))
          > 0.5
        for: 2m
        labels: {severity: ticket}
        annotations:
          summary: "p95 latency above 500ms for 2m (SLO: p95 < 500ms)"
      - alert: LabQueueBacklog
        expr: lab_queue_depth > 50
        for: 2m
        labels: {severity: ticket}
        annotations:
          summary: "Queue depth above 50 for 2m — worker not draining"
      - alert: LabDBDown
        expr: lab_db_up == 0
        for: 1m
        labels: {severity: page}
        annotations:
          summary: "Database unreachable for 1m"
