<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reliability Lab — Topology &amp; Deduction</title>
<style>
  :root { --bg:#0b1220; --panel:#131c31; --line:#263252; --txt:#e8eefc;
          --mut:#93a1c0; --acc:#4f8cff; --ok:#34d399; --bad:#f87171; --warn:#fbbf24; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--txt);
         font-family:"Segoe UI",system-ui,sans-serif; }
  header { padding:14px 24px; border-bottom:1px solid var(--line); background:var(--panel); }
  header h1 { margin:0; font-size:19px; }
  header p { margin:2px 0 0; color:var(--mut); font-size:13px; }
  .wrap { display:grid; grid-template-columns: 1fr 340px; gap:14px;
          max-width:1280px; margin:0 auto; padding:16px 20px 40px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px 16px; }
  .card h2 { margin:0 0 10px; font-size:15px; }
  svg text { font-family:inherit; }
  .node { cursor:pointer; }
  .node rect { fill:var(--panel2,#1a2540); stroke:var(--line); stroke-width:1.5; rx:10; }
  .node.up rect { stroke:var(--ok); } .node.down rect { stroke:var(--bad); }
  .node.off rect { stroke-dasharray:5 4; opacity:.55; }
  .ntitle { fill:var(--txt); font-size:13px; font-weight:700; }
  .nsub { fill:var(--mut); font-size:11px; }
  .edge { stroke:#3b4a6e; stroke-width:1.5; }
  .pkt { r:4; }
  .deduct h2 { margin-top:0; }
  #summary { background:var(--panel2,#1a2540); border:1px solid var(--line);
             border-radius:10px; padding:12px; font-size:14px; margin-bottom:12px; }
  .chk { display:flex; justify-content:space-between; padding:6px 0;
         border-bottom:1px solid var(--line); font-size:13.5px; }
  .pill { padding:2px 10px; border-radius:20px; font-size:12px; font-weight:700; }
  .PASS { background:rgba(52,211,153,.15); color:var(--ok); }
  .FAIL { background:rgba(248,113,113,.15); color:var(--bad); }
  .WARN { background:rgba(251,191,36,.15); color:var(--warn); }
  .rec { font-size:13px; color:var(--mut); margin:6px 0; }
  #detail { font-size:13px; color:var(--mut); margin-top:10px; min-height:40px; }
  #detail b { color:var(--txt); }
  @media (max-width:900px){ .wrap{ grid-template-columns:1fr; } }
</style>
</head>
<body>
<header>
  <h1>Topology &amp; Deduction</h1>
  <p>live discovery · animated real traffic · auto situation report — <a href="/dashboard" style="color:var(--acc)">dashboard</a> · <a href="/docs" style="color:var(--acc)">API docs</a></p>
</header>
<div class="wrap">
  <div class="card">
    <h2>Live topology (click a node)</h2>
    <svg id="topo" viewBox="0 0 760 430" width="100%" role="img" aria-label="live topology">
      <g id="edges"></g>
      <g id="packets"></g>
      <g id="nodes"></g>
    </svg>
    <div id="detail">Click any node for live details.</div>
  </div>
  <div class="card deduct">
    <h2>Deduction</h2>
    <div id="summary">collecting signals…</div>
    <div id="checks"></div>
    <h2 style="margin-top:14px">Recommendations</h2>
    <div id="recs"></div>
  </div>
</div>
<script>
const NS = "http://www.w3.org/2000/svg";
const NODES = [
  { id:"client", x:30,  y:40,  w:110, h:58, title:"you", sub:"browser", fixed:"up" },
  { id:"api",    x:200, y:40,  w:150, h:58, title:"FastAPI :8000", sub:"" },
  { id:"worker", x:200, y:300, w:150, h:58, title:"worker", sub:"" },
  { id:"pg",     x:420, y:40,  w:150, h:58, title:"postgres", sub:"" },
  { id:"redis",  x:420, y:170, w:150, h:58, title:"redis", sub:"cache+queue" },
  { id:"prom",   x:420, y:300, w:150, h:58, title:"prometheus", sub:":9090", probe:"http://127.0.0.1:9090/-/healthy" },
  { id:"graf",   x:620, y:300, w:120, h:58, title:"grafana", sub:":3000", probe:"http://127.0.0.1:3000/login" },
  { id:"serve",  x:620, y:100, w:120, h:58, title:"serving", sub:":8100", probe:"http://127.0.0.1:8100/health" },
];
const EDGES = [
  { a:"client", b:"api",   x1:140, y1:69, x2:200, y2:69, label:"orders" },
  { a:"api", b:"pg",       x1:350, y1:60, x2:420, y2:60, label:"SQL" },
  { a:"api", b:"redis",    x1:350, y1:85, x2:420, y2:185, label:"cache/jobs" },
  { a:"redis", b:"worker", x1:460, y1:228, x2:330, y2:300, label:"drain" },
  { a:"api", b:"prom",     x1:330, y1:98, x2:430, y2:300, label:"scrape", faint:true },
  { a:"prom", b:"graf",    x1:570, y1:329, x2:620, y2:329, label:"feeds", faint:true },
];
let state = { api:"down", worker:"down", pg:"down", redis:"down",
              prom:"off", graf:"off", serve:"off", rps:0, errRatio:0, sit:null };
const $ = id => document.getElementById(id);
function el(n, attrs) {
  const e = document.createElementNS(NS, n);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}
function draw() {
  const gN = $("nodes"); gN.innerHTML = "";
  const gE = $("edges"); gE.innerHTML = "";
  for (const e of EDGES) {
    gE.appendChild(el("line", { x1:e.x1, y1:e.y1, x2:e.x2, y2:e.y2,
      class:"edge", opacity: e.faint ? .45 : 1 }));
    const t = el("text", { x:(e.x1+e.x2)/2, y:(e.y1+e.y2)/2 - 5,
      fill:"#93a1c0", "font-size":10, "text-anchor":"middle" });
    t.textContent = e.label; gE.appendChild(t);
  }
  for (const n of NODES) {
    const st = state[n.id] || "down";
    const g = el("g", { class:"node " + (st === "up" ? "up" : st === "off" ? "off" : "down") });
    g.appendChild(el("rect", { x:n.x, y:n.y, width:n.w, height:n.h, rx:10 }));
    const t1 = el("text", { x:n.x + n.w/2, y:n.y + 24, class:"ntitle", "text-anchor":"middle" });
    t1.textContent = n.title; g.appendChild(t1);
    const t2 = el("text", { x:n.x + n.w/2, y:n.y + 42, class:"nsub", "text-anchor":"middle" });
    t2.textContent = n.live || n.sub; g.appendChild(t2);
    g.addEventListener("click", () => inspect(n.id));
    gN.appendChild(g);
  }
}
function inspect(id) {
  const s = state.sit, d = $("detail");
  if (!s) { d.textContent = "collecting…"; return; }
  const extra = {
    api: `rps ${s.traffic.rps} · p95 ${s.traffic.p95_ms}ms · avail ${s.traffic.availability_pct}%`,
    worker: `processed total keeps climbing in /metrics`,
    pg: `db=${s.dependencies.db} · revenue $${(s.revenue_cents/100).toFixed(2)}`,
    redis: `queue=${s.dependencies.queue_depth} · cache=${s.dependencies.cache.provider}`,
    prom: `scrapes /metrics every 5s · 4 alert rules`,
    graf: `dashboards read Prometheus`,
    serve: `nvidia-smi placed · /predict`,
    client: `that's you — every click is a real request`,
  };
  d.innerHTML = `<b>${id}</b> — ${extra[id] || state[id]}`;
}
// packet animation driven by measured RPS
let pkts = [], last = performance.now(), acc = 0;
function tick(now) {
  const dt = Math.min((now - last) / 1000, .25); last = now;
  const gP = $("packets"); gP.innerHTML = "";
  const hot = EDGES.slice(0, 4);
  acc += Math.min(state.rps, 24) * dt;
  while (acc >= 1 && pkts.length < 60) {
    acc -= 1;
    const e = hot[Math.floor(Math.random() * hot.length)];
    const red = Math.random() < state.errRatio;
    pkts.push({ e, t: 0, red });
  }
  pkts = pkts.filter(p => p.t <= 1);
  for (const p of pkts) {
    p.t += dt * 1.4;
    const cx = p.e.x1 + (p.e.x2 - p.e.x1) * p.t;
    const cy = p.e.y1 + (p.e.y2 - p.e.y1) * p.t;
    gP.appendChild(el("circle", { cx, cy, class:"pkt",
      fill: p.red ? "#f87171" : "#4f8cff" }));
  }
  requestAnimationFrame(tick);
}
async function probe(url, ms=2000) {
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), ms);
  try {
    const r = await fetch(url, { mode: "cors", signal: ctl.signal });
    return r.ok;
  } catch (e) { return false; }
  finally { clearTimeout(t); }
}
async function refresh() {
  try {
    const [live, sit] = await Promise.all([
      fetch("/live").then(r => r.ok).catch(() => false),
      fetch("/api/situation").then(r => r.json())
    ]);
    state.sit = sit;
    state.api = live ? "up" : "down";
    state.worker = "up";
    state.pg = sit.dependencies.db === "up" ? "up" : "down";
    state.redis = sit.dependencies.queue_provider === "redis" ? "up" : "down";
    state.rps = sit.traffic.rps || 0;
    state.errRatio = Math.min(Math.max((100 - sit.traffic.availability_pct) / 100, sit.chaos.error_rate || 0), 1);
    $("summary").textContent = sit.summary;
    $("checks").innerHTML = sit.checks.map(c =>
      `<div class="chk"><span>${c.name} <span style="color:var(--mut)">${c.value}${c.unit ? " " + c.unit : ""}</span></span><span class="pill ${c.verdict}">${c.verdict}</span></div>`).join("");
    $("recs").innerHTML = sit.recommendations.length
      ? sit.recommendations.map(r => `<p class="rec">→ ${r}</p>`).join("")
      : '<p class="rec">None — hold course.</p>';
    draw();
    // probes last, in parallel: never block the deduction paint
    const probed = await Promise.all(
      NODES.filter(n => n.probe).map(n => probe(n.probe).then(ok => [n.id, ok])));
    for (const [id, ok] of probed) state[id] = ok ? "up" : "off";
    for (const n of NODES) {
      if (n.id === "api") n.live = `rps ${sit.traffic.rps}`;
      if (n.id === "pg") n.live = sit.dependencies.db;
      if (n.id === "redis") n.live = `q=${sit.dependencies.queue_depth}`;
    }
    draw();
  } catch (e) {
    $("summary").textContent = "API unreachable — start services first.";
    state.api = "down";
    draw();
  }
}
draw();
refresh();
setInterval(refresh, 3000);
requestAnimationFrame(tick);
</script>
</body>
</html>
