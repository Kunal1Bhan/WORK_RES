apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: chaosexperiments.lab.io
spec:
  group: lab.io
  names:
    kind: ChaosExperiment
    listKind: ChaosExperimentList
    plural: chaosexperiments
    singular: chaosexperiment
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required: [scenario]
          properties:
            scenario:
              type: string
              description: failurectl scenario (latency, error, cpu, kill-pods, scale)
            params:
              type: object
              x-kubernetes-preserve-unknown-fields: true
            schedule:
              type: string
              description: cron expression for scheduled runs (FR11)
            rollbackOnError:
              type: boolean
            status:
              type: object
              properties:
                phase: {type: string}
                lastRun: {type: string}
